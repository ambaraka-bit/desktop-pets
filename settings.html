<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Desktop Pets — Settings</title>
    <style>
      body {
        font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: #1e1e2e;
        color: #eee;
      }
      h2 {
        margin-top: 0;
        font-size: 16px;
        color: #fff;
      }
      .control {
        margin-bottom: 20px;
      }
      .control.check {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .control.check input[type='checkbox'] {
        width: auto;
        margin: 0;
        flex: none;
      }
      .control.check label {
        display: inline;
        margin: 0;
        font-size: 13px;
        color: #ccc;
        line-height: 1.4;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        color: #ccc;
      }
      .value {
        float: right;
        color: #8ab4f8;
      }
      input[type='range'] {
        width: 100%;
      }
      button {
        background: #8ab4f8;
        color: #1e1e2e;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
      }
      button:hover {
        background: #a8c7fa;
      }
      .hint {
        font-size: 12px;
        color: #888;
        margin: 4px 0 16px;
      }
      .roster {
        background: #16161f;
        border: 1px solid #2e2e40;
        border-radius: 4px;
        padding: 8px;
        font-size: 12px;
        color: #aaa;
        max-height: 160px;
        overflow-y: auto;
      }
      .roster-empty {
        color: #666;
        font-style: italic;
      }
      .roster-item {
        display: flex;
        justify-content: space-between;
        padding: 2px 0;
      }
      .roster-item .guest {
        color: #7cfc00;
      }
    </style>
  </head>
  <body>
    <h2>Pet Settings</h2>

    <div class="control">
      <label>Size <span class="value" id="size-value">100%</span></label>
      <input type="range" id="size-slider" min="20" max="200" value="100" />
    </div>

    <div class="control">
      <label>Speed <span class="value" id="speed-value">100%</span></label>
      <input type="range" id="speed-slider" min="20" max="300" value="100" />
    </div>

    <div class="control">
      <label>Volume <span class="value" id="volume-value">50%</span></label>
      <input type="range" id="volume-slider" min="0" max="100" value="50" />
    </div>

    <div class="control check">
      <input type="checkbox" id="mute-checkbox" />
      <label for="mute-checkbox">Mute all sounds</label>
    </div>

    <div class="control check">
      <input type="checkbox" id="dnd-checkbox" />
      <label for="dnd-checkbox">Auto-pause during fullscreen apps (Do Not Disturb)</label>
    </div>

    <div class="control check">
      <input type="checkbox" id="borders-checkbox" />
      <label for="borders-checkbox">Walk along the focused window's top edge</label>
    </div>

    <div class="control check">
      <input type="checkbox" id="reduce-motion-checkbox" />
      <label for="reduce-motion-checkbox">Reduce motion (pets stay still)</label>
    </div>

    <div class="control check">
      <input type="checkbox" id="contrast-checkbox" />
      <label for="contrast-checkbox">High-contrast outline</label>
    </div>

    <div class="control check">
      <input type="checkbox" id="larger-checkbox" />
      <label for="larger-checkbox">Larger sprites (150%)</label>
    </div>

    <div class="control check">
      <input type="checkbox" id="overapps-checkbox" />
      <label for="overapps-checkbox"
        >Show pets over all open apps (uncheck to keep them on the desktop only)</label
      >
    </div>

    <div class="control check">
      <input type="checkbox" id="autolaunch-checkbox" />
      <label for="autolaunch-checkbox">Start with Windows (auto-launch on login)</label>
    </div>

    <div class="control">
      <label>Pets on screen</label>
      <div class="roster" id="roster-list"><span class="roster-empty">Loading…</span></div>
    </div>

    <p class="hint">
      Global hotkeys: Ctrl+Alt+P to pause/resume &middot; Ctrl+Alt+M to mute/unmute
    </p>

    <button id="close-btn">Done</button>

    <script src="settings-renderer.js"></script>
  </body>
</html>
